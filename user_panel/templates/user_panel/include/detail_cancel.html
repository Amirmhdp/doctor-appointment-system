{% load poll_extras %}
<div class="relative bg-white rounded-2xl w-full max-w-sm p-6 text-center">
    <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-red-500" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
    </div>

    <h2 class="font-bold text-slate-800 mb-2">لغو نوبت</h2>
    <p class="text-sm text-slate-500 mb-1">آیا مطمئن هستید که می‌خواهید نوبت زیر را لغو کنید؟</p>

    <div class="bg-slate-50 rounded-xl p-3 my-4 text-right">
        <div id="cm-doctor" class="text-sm font-medium text-slate-800">دکتر {{ appointment.doctor.user.get_full_name }}</div>
        <div id="cm-time" class="text-xs text-slate-400 mt-1"> {{ appointment.available_slot.date|to_jalali }} — {{ appointment.available_slot.start_time }}</div>
    </div>

    <div class="flex gap-3">
        <button class="flex-1 border cursor-pointer border-slate-200 text-slate-600 text-sm font-medium py-2.5 rounded-xl"
                id="close-cancle-modal">انصراف
        </button>
        <button data-delete-appointment-id="{{ appointment.id }}"
                id="confirm-cancel-btn"
                class="flex-1 cursor-pointer bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2.5 rounded-xl">
            بله، لغو کن
        </button>
    </div>
</div>
